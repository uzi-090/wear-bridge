name: Wear OS Build and Test

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wearos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 preview SDK platform 37
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Wear OS unit tests
        working-directory: wearos
        run: |
          ./gradlew \
            :ancs:test \
            :ams:test \
            :protocol:test \
            :app:testDebugUnitTest

      - name: Build debug and profiling APKs
        working-directory: wearos
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:assembleProfiling

      - name: Upload Wear OS APKs
        uses: actions/upload-artifact@v4
        with:
          name: wearos-apks
          path: |
            wearos/app/build/outputs/apk/debug/*.apk
            wearos/app/build/outputs/apk/profiling/*.apk
          if-no-files-found: error
          retention-days: 14
