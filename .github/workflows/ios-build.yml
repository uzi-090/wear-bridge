name: iOS Build and Test

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Test on iPhone SE (3rd generation) simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -project Bridge.xcodeproj \
            -scheme PairingPOC \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=26.2' \
            -resultBundlePath "$RUNNER_TEMP/BridgeTests.xcresult"

      - name: Archive unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Bridge.xcodeproj \
            -scheme PairingPOC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bridge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/Bridge.xcarchive/Products/Applications/PairingPOC.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/PairingPOC.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/Bridge-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: Bridge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/BridgeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
