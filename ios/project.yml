# Generate the Xcode project with:  cd ios && xcodegen
name: Bridge
options:
  bundleIdPrefix: io.wearbridge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your Apple Developer team ID here (or in Xcode → Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
targets:
  PairingPOC:
    type: application
    platform: iOS
    sources:
      - PairingPOC
    # Find iPhone alerts ask for Time Sensitive delivery (breaks through Focus). That needs the
    # com.apple.developer.usernotifications.time-sensitive entitlement, which personal (free) teams can't
    # sign, so it's off here. With a paid team, add:
    #   entitlements: { path: PairingPOC/PairingPOC.entitlements, properties: { com.apple.developer.usernotifications.time-sensitive: true } }
    info:
      path: PairingPOC/Info.plist
      properties:
        CFBundleDisplayName: Bridge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
        NSContactsUsageDescription: >-
          Bridge copies names and phone numbers to your watch over Bluetooth, so you can see who's who and
          start calls from your wrist. Contacts never leave your iPhone and watch.
        NSBluetoothAlwaysUsageDescription: >-
          Bridge uses Bluetooth to connect directly to your watch, so it can show your iPhone's
          notifications and calls. Nothing is sent to the internet.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wearbridge.pairingpoc
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        # No app icon yet. Assets.xcassets only holds the bundled app logos.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PairingPOCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PairingPOCTests
    dependencies:
      - target: PairingPOC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
  PairingPOCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PairingPOCUITests
    dependencies:
      - target: PairingPOC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PairingPOC
schemes:
  PairingPOC:
    build:
      targets:
        PairingPOC: all
        PairingPOCTests: [test]
    test:
      targets:
        - PairingPOCTests
  PairingHardwareQA:
    build:
      targets:
        PairingPOC: all
        PairingPOCUITests: [test]
    test:
      targets:
        - PairingPOCUITests
